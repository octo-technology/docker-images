# Failles volontairement ignorées pour l'image code-server.
# Convention (appliquée par generic-docker-build.yml) :
#   - statement : justification - pourquoi la faille n'est pas corrigeable maintenant
#   - expired_at : date (AAAA-MM-JJ) après laquelle l'ignore expire et force
#     la réévaluation de la faille (convention : ~3 mois après ajout)
vulnerabilities:
  # CVE-2025-22874 est détectée via la stdlib Go vulnérable d'une dépendance
  # (probablement krew ou un outil lié). Ignore temporaire en attendant un fix
  # upstream (Go >= 1.24.4 ou une release patchée de krew).
  - id: CVE-2025-22874
    statement: "Vulnerable Go stdlib bundled in a dependency (likely krew or a related tool); ignored until an upstream fix is available (Go >= 1.24.4 or a patched krew release)"
    expired_at: 2027-01-05

  # sudo (packages système de l'image de base)
  - id: CVE-2025-32462
    statement: "sudo package CVE, no actionable fix in the base image right now; to re-evaluate on next base image update"
    expired_at: 2027-01-05
  - id: CVE-2025-32463
    statement: "sudo package CVE, no actionable fix in the base image right now; to re-evaluate on next base image update"
    expired_at: 2027-01-05

  # go stdlib (binaires krew, docker-buildx, docker-compose)
  - id: CVE-2025-47907
    statement: "Go stdlib CVE bundled in krew/docker-buildx/docker-compose binaries; waiting for upstream releases"
    expired_at: 2027-01-05
