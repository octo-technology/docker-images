name: Reusable Docker Build and Scan

on:
  workflow_call:
    inputs:
      image-folder:
        required: true
        type: string
      image-name:
        required: false
        type: string
      image-tag:
        required: true
        type: string
      skip-dirs:
        required: false
        type: string
        default: /usr/local/bin
      ignored-dockerfile-lint-rules:
        required: false
        type: string
        default: "DL3008,DL3015,DL3018"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (multi-platform)
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ inputs.image-folder }}
          push: false
          load: false
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image-name || inputs.image-folder }}:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,compression=zstd
          provenance: false
          outputs: type=oci,compression=zstd,dest=${{ runner.temp }}/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: build
    steps:
      - uses: actions/checkout@v7
      
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Load Docker image for scanning (amd64 only)
        run: |
          mkdir -p ${{ runner.temp }}/image
          tar -xf ${{ runner.temp }}/image.tar -C ${{ runner.temp }}/image

      - name: Ensure a .trivyignore.yaml file exists for this image
        run: |
          if [ ! -f "${{ inputs.image-folder }}/.trivyignore.yaml" ]; then
            echo "vulnerabilities: []" > "${{ inputs.image-folder }}/.trivyignore.yaml"
            echo "Created empty .trivyignore.yaml for ${{ inputs.image-folder }}"
          fi

      # Pass 1/2 - Transparency: report every fixable CRITICAL/HIGH finding to the
      # GitHub Security tab. Never blocks the pipeline, even when findings exist.
      - name: Trivy scan - transparency report (SARIF, never blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with: 
          input: ${{ runner.temp }}/image
          #image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image-name || inputs.image-folder }}:${{ inputs.image-tag }}
          ignore-unfixed: true
          skip-dirs: ${{ inputs.skip-dirs }}
          trivyignores: "${{ inputs.image-folder }}/.trivyignore.yaml"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      # Pass 2/2 - Gate: fail the job (and thus block the image push) only when
      # the image contains fixable CRITICAL vulnerabilities. Everything else
      # (HIGH, unfixed upstream, or listed in .trivyignore.yaml) passes.
      - name: Trivy gate - fail on fixable CRITICAL vulnerabilities only
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: ${{ inputs.skip-dirs }}
          trivyignores: "${{ inputs.image-folder }}/.trivyignore.yaml"
          vuln-type: "os,library"
          severity: "CRITICAL"
          format: 'table'

      - name: Publish scan summary
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "### Trivy image scan - no SARIF report was produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total=$(jq '[.runs[0].results[]?] | length' trivy-results.sarif)
          {
            echo "### Trivy image scan - ${{ inputs.image-folder }}"
            echo ""
            echo "| Fixable findings (CRITICAL, HIGH) |"
            echo "|---|"
            echo "| $total |"
            echo ""
            echo "Full report in the Security tab (code scanning, category \`trivy-image-${{ inputs.image-folder }}\`)."
            echo "Only fixable CRITICAL findings block the image push; everything else is informational."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.38.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-image-${{ inputs.image-folder }}'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dockerfile linting
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.image-folder }}/Dockerfile
          ignore: ${{ inputs.ignored-dockerfile-lint-rules }}

  push:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: [build, scan, lint]
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download multi-platform image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Push the exact scanned multi-platform image with skoppeo
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          mkdir -p ${{ runner.temp }}/image
          tar -xf ${{ runner.temp }}/image.tar -C ${{ runner.temp }}/image
          skopeo copy --all oci:${{ runner.temp }}/image docker://${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image-name || inputs.image-folder }}:${{ inputs.image-tag }}
